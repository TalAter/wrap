[package]
name = "wrap"
version = "0.0.7"
edition = "2024"
license = "MIT"
publish = false
description = "Natural language shell commands"

[[bin]]
name = "wrap"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["use-dev-tty", "event-stream"] }
jsonc-parser = { version = "0.34.0", features = ["serde"] }
libc = "0.2.191"
palette = "0.7.7"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal-colorsaurus = "1.0.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
